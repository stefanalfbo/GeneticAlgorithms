name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore genetic-algorithms.sln

      - name: Build solution
        run: dotnet build genetic-algorithms.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --project tests/GeneticAlgorithms.Tests/GeneticAlgorithms.Tests.fsproj --configuration Release --no-build
